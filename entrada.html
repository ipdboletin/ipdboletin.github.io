<!-- ============ MARKED.JS (renderizar Markdown) ============ -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- ============ LÓGICA ============ -->
<script>
/* ---------- Tema claro/oscuro ---------- */
(function(){
  const html = document.documentElement;
  const btn = document.getElementById('btnTema');
  const guardado = localStorage.getItem('ipd-tema');
  if (guardado === 'oscuro') {
    html.setAttribute('data-tema', 'oscuro');
    btn.textContent = '☀️';
  }
  btn.addEventListener('click', function(){
    const esOscuro = html.getAttribute('data-tema') === 'oscuro';
    if (esOscuro) {
      html.removeAttribute('data-tema');
      localStorage.setItem('ipd-tema', 'claro');
      btn.textContent = '🌙';
    } else {
      html.setAttribute('data-tema', 'oscuro');
      localStorage.setItem('ipd-tema', 'oscuro');
      btn.textContent = '☀️';
    }
  });
})();

/* ---------- Entrada: leer un .md específico ---------- */
(function(){
  const REPO = 'ipdboletin/ipdboletin.github.io';
  const RAMA = 'main';
  const CARPETA = 'blog';

  const cargando = document.getElementById('estadoCargando');
  const error = document.getElementById('estadoError');
  const articulo = document.getElementById('articulo');

  // Helpers
  const escapeHtml = (s) => (s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  const fmtFecha = (f) => {
    if (!f) return '';
    const d = new Date(f);
    if (isNaN(d)) return f;
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' });
  };

  // Parsear frontmatter + devolver cuerpo
  function parseMd(texto){
    const match = texto.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
    if (!match) return { frontmatter: {}, cuerpo: texto };
    const yaml = match[1];
    const cuerpo = match[2];
    const fm = {};
    yaml.split('\n').forEach(linea => {
      const m = linea.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*:\s*(.*)$/);
      if (m){
        let valor = m[2].trim().replace(/^['"]|['"]$/g, '');
        fm[m[1]] = valor;
      }
    });
    return { frontmatter: fm, cuerpo: cuerpo };
  }

  // Obtener slug de la URL
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');

  if (!slug){
    cargando.style.display = 'none';
    error.style.display = 'block';
    return;
  }

  // Cargar el .md
  async function cargarEntrada(){
    try {
      const urlRaw = `https://raw.githubusercontent.com/${REPO}/${RAMA}/${CARPETA}/${slug}.md?t=${Date.now()}`;
      const res = await fetch(urlRaw);
      if (!res.ok) throw new Error('No se encontró');
      const texto = await res.text();
      const { frontmatter: fm, cuerpo } = parseMd(texto);

      // Actualizar meta tags
      document.title = (fm.title || 'Nota') + ' — IPD';
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc && fm.excerpt) metaDesc.setAttribute('content', fm.excerpt);

      // Llenar el artículo
      document.getElementById('artTitulo').textContent = fm.title || 'Sin título';
      document.getElementById('artCopete').textContent = fm.excerpt || '';
      document.getElementById('artFecha').textContent = fmtFecha(fm.date);

      if (fm.image){
        const img = document.getElementById('artImagen');
        img.src = fm.image;
        img.alt = fm.title || '';
        img.style.display = 'block';
      }

      // Renderizar Markdown
      document.getElementById('artCuerpo').innerHTML = marked.parse(cuerpo);

      // Mostrar
      cargando.style.display = 'none';
      articulo.style.display = 'block';

    } catch(e){
      console.error('Error cargando entrada:', e);
      cargando.style.display = 'none';
      error.style.display = 'block';
    }
  }

  // Compartir
  document.getElementById('btnCompartir').addEventListener('click', async () => {
    const url = location.href;
    const titulo = document.getElementById('artTitulo').textContent;
    if (navigator.share){
      try {
        await navigator.share({ title: titulo, url: url });
      } catch(e){ /* cancelado */ }
    } else {
      try {
        await navigator.clipboard.writeText(url);
        alert('Link copiado al portapapeles');
      } catch(e){
        alert('No se pudo copiar');
      }
    }
  });

  cargarEntrada();
})();
</script>

</body>
