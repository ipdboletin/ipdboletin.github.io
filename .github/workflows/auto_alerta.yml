name: Escáner Automático IPD

on:
  schedule:
    - cron: '15 8 * * 1-5'
  workflow_dispatch:

jobs:
  procesar_boletin:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar espacio de trabajo limpio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inicializar Entorno de Ejecución
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Desplegar Dependencias de Red
        run: pip install requests

      - name: Ejecución del Despacho Autónomo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_final.py
          import os
          import requests
          
          t = os.environ.get("TELEGRAM_TOKEN")
          c = os.environ.get("TELEGRAM_CHAT_ID")
          
          endpoint = "https://telegram.org" + str(t) + "/sendMessage"
          
          payload = {
              "chat_id": str(c),
              "text": "📢 IPD: Alerta Temprana del Bolsillo Popular\n\n🔍 EN CRIOLLO: El motor autónomo de la trinchera está oficialmente en marcha.\n⚠️ CÓMO TE AFECTA: Monitoreo activado al 100% en internet. Vos descansás y la máquina labura por la patria.\n📝 LA LETRA CHICA: Código limpio ejecutado desde servidores libres de candados corporativos.\n\n━━━━━━━━━━━━━━━━━━━\n🌐 Sumate a la comunidad y registrá tu mail:\nhttps://github.io"
          }
          
          response = requests.post(endpoint, json=payload)
          print(f"HTTP Status: {response.status_code}")
          print(f"API Response: {response.text}")
          
          if response.status_code != 200:
              exit(1)
          EOF
          python run_final.py
