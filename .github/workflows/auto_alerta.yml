name: Escáner Automático IPD

on:
  schedule:
    # 05:15 AM de Argentina (ART = UTC-3) se traduce a las 08:15 AM UTC
    - cron: '15 8 * * 1-5'
  workflow_dispatch: # Activa el botón para disparar el test manual desde la web

jobs:
  procesar_boletin:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar espacio de trabajo limpio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inicializar Entorno de Ejecución
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Desplegar Dependencias de Red
        run: pip install requests

      - name: Ejecución del Despacho Autónomo desde la Raíz
        # Vincula de forma segura tus Secrets de GitHub con las variables del script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python script.py
