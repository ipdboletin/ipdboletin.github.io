name: Escáner Automático IPD

on:
  schedule:
    # 07:40 AM de Argentina (ART = UTC-3) se traduce a las 10:40 AM UTC
    - cron: '40 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar_boletin:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo público (frontend + datos.js)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: repo_publico
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clonar repo privado (script)
        uses: actions/checkout@v4
        with:
          repository: ipdboletin/ipd-script
          token: ${{ secrets.PAT_SCRIPT }}
          path: ipd-script
          fetch-depth: 1
          persist-credentials: true # Permiso para hacer push en el privado (por las dudas)

      - name: Inicializar Entorno de Ejecución
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Desplegar Dependencias de Red
        run: pip install requests python-dotenv pdfplumber tzdata

      - name: Ejecución del Despacho Autónomo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RUTA_DATOS_JS_ENV: ${{ github.workspace }}/repo_publico/datos.js
        working-directory: ./ipd-script
        run: python script.py

      - name: Limpiar archivos temporales
        working-directory: ./repo_publico
        run: |
          rm -f *.temp.pdf *.temp.html
          rm -f nacion_indice_temp.html nacion_aviso_temp.html
          rm -f boletin_pba_temp.pdf norma_caba_temp.pdf

      - name: Commitear datos y caché en repo público
        working-directory: ./repo_publico
        run: |
          git config --local user.name "IPD Bot"
          git config --local user.email "bot@ipd.local"
          
          # Agregamos el datos.js y los JSON de caché (que ahora se guardan acá)
          git add datos.js procesadas.json descartadas.json
          git add index.html historial.html entrada.html blog.html 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "ℹ️ No hay cambios para commitear."
          else
            git commit -m "🤖 Update IPD - $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "✅ Repo público actualizado con datos y caché."
          fi
