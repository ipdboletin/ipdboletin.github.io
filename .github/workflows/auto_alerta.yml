name: Escáner Automático IPD

on:
  schedule:
    # 07:40 AM de Argentina (ART = UTC-3) se traduce a las 10:40 AM UTC
    - cron: '40 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar_boletin:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar espacio de trabajo limpio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inicializar Entorno de Ejecución
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Desplegar Dependencias de Red
        run: pip install requests python-dotenv pdfplumber

      - name: Ejecución del Despacho Autónomo desde la Raíz
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: python script.py

      - name: Commitear cambios en datos.js
        run: |
          git config --local user.name "IPD Bot"
          git config --local user.email "bot@ipd.local"
          git add datos.js
          if git diff --cached --quiet; then
            echo "ℹ️ No hay cambios en datos.js. No se commitea."
          else
            git commit -m "🤖 Nuevo artículo IPD - $(date +'%Y-%m-%d')"
            git push
            echo "✅ datos.js actualizado y pusheado."
          fi
