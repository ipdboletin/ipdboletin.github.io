<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo Histórico de Boletines – IPD</title>
    <style>
        :root { --azul-tactico: #1D3557; --gris-oscuro: #2D3748; --gris-claro: #F7FAFC; }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--gris-claro); color: var(--gris-oscuro); }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .logo-condor { display: block; margin: 0 auto 15px auto; max-width: 110px; height: auto; }
        h1 { color: var(--azul-tactico); text-align: center; text-transform: uppercase; font-size: 24px; margin-bottom: 25px; letter-spacing: 1px; }
        .search-box { width: 100%; padding: 12px; border: 2px solid var(--azul-tactico); border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 25px; text-align: center; }
        .tabs { display: flex; justify-content: space-between; margin-bottom: 25px; border-bottom: 2px solid #E2E8F0; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; font-size: 16px; font-weight: bold; color: #718096; cursor: pointer; text-align: center; transition: 0.3s; }
        .tab-btn.active { color: var(--azul-tactico); border-bottom: 4px solid var(--azul-tactico); }
        .archivo-mes-seccion { margin-top: 30px; }
        .mes-titulo { font-size: 18px; font-weight: bold; color: var(--azul-tactico); border-bottom: 2px solid #E2E8F0; padding-bottom: 5px; margin-bottom: 15px; text-transform: uppercase; }
        .fecha-etiqueta { font-size: 12px; font-weight: bold; color: #718096; margin-bottom: 5px; display: block; }
        .articulo-card { background: #ffffff; border: 1px solid #E2E8F0; border-radius: 8px; margin-bottom: 15px; overflow: hidden; transition: 0.2s; }
        .articulo-card:hover { border-color: var(--azul-tactico); }
        .articulo-header { padding: 15px; background: #ffffff; cursor: pointer; font-weight: bold; color: var(--azul-tactico); font-size: 16px; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .articulo-header::after { content: '▼'; font-size: 12px; color: #A0AEC0; transition: 0.3s; }
        .articulo-card.open .articulo-header::after { transform: rotate(180deg); color: var(--azul-tactico); }
        .articulo-body { max-height: 0; padding: 0 15px; background: #FAFAFA; overflow: hidden; transition: all 0.3s ease-out; font-size: 15px; line-height: 1.6; }
        .articulo-card.open .articulo-body { max-height: 2000px; padding: 15px; border-top: 1px solid #E2E8F0; }
        .bloque-ipd { margin-bottom: 12px; }
        .bloque-ipd strong { display: block; color: var(--azul-tactico); text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; margin-bottom: 4px; }
        .no-results { text-align: center; color: #A0AEC0; margin-top: 20px; display: none; }
        .back-link { display: block; text-align: center; margin-top: 30px; color: #74B9FF; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>📂 Memoria Colectiva IPD</h1>
        <img src="INFOFD-Photoroom.png" alt="Cóndor IPD" class="logo-condor">
        <input type="text" id="buscador" class="search-box" placeholder="Buscar por palabra clave, decreto o tema..." onkeyup="renderizarArchivo()">

        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarJurisdiccion('nacion', this)">NACIÓN</button>
            <button class="tab-btn" onclick="cambiarJurisdiccion('pba', this)">PBA</button>
            <button class="tab-btn" onclick="cambiarJurisdiccion('caba', this)">CABA</button>
        </div>

        <div id="contenedor-archivo"></div>
        <div id="no-results" class="no-results">❌ No se encontraron artículos que coincidan con la búsqueda.</div>
        <a href="index.html" class="back-link">← Volver al Inicio</a>
    </div>

    <!-- Inyección atómica del caño de datos separado -->
    <script src="datos.js"></script>
    <script>
        let jurisdiccionActiva = 'nacion';
        const mesesNombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        // Convierte los saltos de línea (\n) en <br> para que se vean en HTML
        function formatearTexto(texto) {
            if (!texto) return "";
            return texto.replace(/\n/g, '<br>');
        }

        function cambiarJurisdiccion(jur, btn) {
            jurisdiccionActiva = jur;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('buscador').value = '';
            renderizarArchivo();
        }

        function toggleCard(header) {
            header.parentElement.classList.toggle('open');
        }

        function renderizarArchivo() {
            const query = document.getElementById('buscador').value.toLowerCase().trim();
            const contenedor = document.getElementById('contenedor-archivo');
            contenedor.innerHTML = '';

            const datosFiltrados = baseDatosIPD.filter(art => {
                if (art.jurisdiccion !== jurisdiccionActiva) return false;
                if (query === '') return true;
                return art.titulo.toLowerCase().includes(query) ||
                       art.criollo.toLowerCase().includes(query) ||
                       art.afecta.toLowerCase().includes(query) ||
                       art.letraChica.toLowerCase().includes(query);
            });

            if (datosFiltrados.length === 0) {
                document.getElementById('no-results').style.display = 'block';
                return;
            } else {
                document.getElementById('no-results').style.display = 'none';
            }

            const grupos = {};
            datosFiltrados.forEach(art => {
                const fechaObj = new Date(art.fecha + "T00:00:00");
                const año = fechaObj.getFullYear();
                const mes = mesesNombres[fechaObj.getMonth()];
                const claveGrupo = `${mes} de ${año}`;

                if (!grupos[claveGrupo]) grupos[claveGrupo] = [];
                grupos[claveGrupo].push(art);
            });

            for (const [mesAño, articulos] of Object.entries(grupos)) {
                const seccion = document.createElement('div');
                seccion.className = 'archivo-mes-seccion';
                seccion.innerHTML = `<div class="mes-titulo">📅 ${mesAño}</div>`;

                articulos.forEach(art => {
                    // Fecha bien formateada (DD/MM/YYYY)
                    const partesFecha = art.fecha.split('-');
                    const fechaFormateada = `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}`;

                    const card = document.createElement('div');
                    card.className = 'articulo-card';
                    card.innerHTML = `
                        <div class="articulo-header" onclick="toggleCard(this)">
                            <div>
                                <span class="fecha-etiqueta">Publicado: ${fechaFormateada}</span>
                                ${art.titulo}
                            </div>
                        </div>
                        <div class="articulo-body">
                            <div class="bloque-ipd"><strong>🔍 La Posta:</strong> ${formatearTexto(art.criollo)}</div>
                            <div class="bloque-ipd"><strong>⚠️ Cómo te afecta:</strong> ${formatearTexto(art.afecta)}</div>
                            <div class="bloque-ipd"><strong>📝 La Letra Chica:</strong> ${formatearTexto(art.letraChica)}</div>
                        </div>
                    `;
                    seccion.appendChild(card);
                });
                contenedor.appendChild(seccion);
            }
        }
        renderizarArchivo();
    </script>
</body>
</html>
